<!DOCTYPE html>
<html>
<head>
    <title>Minimal Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 20px 40px; font-size: 18px; cursor: pointer; }
        #status { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Minimal Razorpay Test</h1>
    <p>Testing with hardcoded test key and order...</p>
    
    <button onclick="openRazorpay()">Pay ₹29</button>
    <div id="status"></div>

    <script>
        console.log('Script loaded');
        console.log('Razorpay type:', typeof Razorpay);

        function log(msg, type) {
            console.log(msg);
            const status = document.getElementById('status');
            status.innerText = msg;
            if (type) {
                status.className = type;
            }
        }

        async function createOrder() {
            log('Creating order...');
            try {
                const response = await fetch('/api/payment/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 11 }),
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to create order');
                }
                
                const data = await response.json();
                log('Order created: ' + data.orderId, 'success');
                return data;
            } catch (err) {
                log('Error: ' + err.message, 'error');
                throw err;
            }
        }

        async function openRazorpay() {
            try {
                log('Starting Razorpay...');
                
                // First create order
                const orderData = await createOrder();
                
                log('Opening Razorpay with order: ' + orderData.orderId);
                
                const options = {
                    key: 'rzp_test_Sk1Qr5nGd7fPmU',
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: 'JT Group Test',
                    description: 'Test Payment',
                    order_id: orderData.orderId,
                    handler: function(response) {
                        log('SUCCESS! Payment ID: ' + response.razorpay_payment_id, 'success');
                    },
                    modal: {
                        ondismiss: function() {
                            log('CANCELLED by user');
                        }
                    },
                    theme: { color: '#0c1f33' },
                    _debug: true  // Enable debug mode
                };

                log('Creating Razorpay instance...');
                const rzp = new Razorpay(options);
                
                rzp.on('payment.failed', function(response) {
                    log('FAILED: ' + (response.error?.description || response.error?.reason), 'error');
                });
                
                log('Calling rzp.open()...');
                rzp.open();
                
                log('rzp.open() called. Check if popup appears...');
                
            } catch (err) {
                log('ERROR: ' + err.message, 'error');
                console.error('Full error:', err);
            }
        }
        
        // Check on load
        window.addEventListener('load', function() {
            log('Page loaded. Razorpay loaded: ' + (typeof Razorpay !== 'undefined'), 
                typeof Razorpay !== 'undefined' ? 'success' : 'error');
        });
    </script>

<script>
(function(){
    var langMap = {tamil:'ta', hindi:'hi', bengali:'bn', malayalam:'ml', telugu:'te'};
    var path = window.location.pathname;
    var match = path.match(/\/courses\/(tamil|hindi|bengali|malayalam|telugu)\//);
    var targetLang = match ? langMap[match[1]] : 'ta';
    if (targetLang === 'ta') return;
    var div = document.createElement('div');
    div.id = 'gt_auto';
    div.style.cssText = 'display:none!important;width:0!important;height:0!important';
    document.body.appendChild(div);
    window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
            pageLanguage: 'ta',
            includedLanguages: 'ta,hi,bn,ml,te,en',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'gt_auto');
        var check = setInterval(function() {
            var sel = document.querySelector('.goog-te-combo');
            if (sel && sel.options.length > 1) {
                clearInterval(check);
                sel.value = targetLang;
                sel.dispatchEvent(new Event('change'));
            }
        }, 200);
    };
})();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<style>
.goog-te-banner-frame.skiptranslate{display:none!important}
body{top:0!important}
.goog-te-gadget{display:none!important}
.skiptranslate{display:none!important}
</style>
