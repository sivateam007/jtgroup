<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Payment Flow</title>
</head>
<body>
    <h1>Payment Flow Test</h1>
    
    <button onclick="testFlow()">Start Test</button>
    <div id="log"></div>

    <script>
    async function testFlow() {
        const log = (msg) => {
            document.getElementById('log').innerHTML += '<p>' + msg + '</p>';
            console.log(msg);
        };

        try {
            // 1. Login
            log('1. Logging in...');
            const loginRes = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@example.com', password: 'test123' }),
                credentials: 'include'
            });
            
            if (!loginRes.ok) throw new Error('Login failed');
            log('✓ Logged in!');

            // 2. Check auth
            const userRes = await fetch('/api/auth/me', { credentials: 'include' });
            const user = await userRes.json();
            log('✓ Authenticated as: ' + user.name);

            // 3. Create payment
            log('Creating payment...');
            const payRes = await fetch('/api/payment/create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
                credentials: 'include'
            });

            if (!payRes.ok) {
                const err = await payRes.json();
                throw new Error(err.error || 'Payment creation failed');
            }

            const payData = await payRes.json();
            log('✓ Payment link created: ' + payData.hostedUrl);
            log('Redirecting to Razorpay...');
            
            // 4. Redirect
            window.location.href = payData.hostedUrl;

        } catch (err) {
            log('✗ Error: ' + err.message);
            console.error(err);
        }
    }
    </script>

<script>
(function(){
    var langMap = {tamil:'ta', hindi:'hi', bengali:'bn', malayalam:'ml', telugu:'te'};
    var path = window.location.pathname;
    var match = path.match(/\/courses\/(tamil|hindi|bengali|malayalam|telugu)\//);
    var targetLang = match ? langMap[match[1]] : 'ta';
    if (targetLang === 'ta') return;
    var div = document.createElement('div');
    div.id = 'gt_auto';
    div.style.cssText = 'display:none!important;width:0!important;height:0!important';
    document.body.appendChild(div);
    window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
            pageLanguage: 'ta',
            includedLanguages: 'ta,hi,bn,ml,te,en',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'gt_auto');
        var check = setInterval(function() {
            var sel = document.querySelector('.goog-te-combo');
            if (sel && sel.options.length > 1) {
                clearInterval(check);
                sel.value = targetLang;
                sel.dispatchEvent(new Event('change'));
            }
        }, 200);
    };
})();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<style>
.goog-te-banner-frame.skiptranslate{display:none!important}
body{top:0!important}
.goog-te-gadget{display:none!important}
.skiptranslate{display:none!important}
</style>
