<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - JT GROUP OF INSTITUTION</title>
    <link rel="icon" href="/assets/images/jt_logo.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        header { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; padding: 1rem; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .price { font-size: 4rem; font-weight: bold; text-align: center; color: #2d3748; }
        .btn { width: 100%; padding: 1.2rem; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
        .btn:disabled { opacity: 0.6; }
        .error { background: #fff5f5; color: #c53030; padding: 1rem; border-radius: 10px; margin: 1rem 0; display: none; }
        .success { background: #f0fff4; color: #2f855a; padding: 1rem; border-radius: 10px; margin: 1rem 0; display: none; }
        .info { background: #e6f3ff; padding: 12px; margin: 1rem 0; font-size: 0.9rem; border-radius: 6px; }
    </style>
</head>
<body>
    <header>
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="/assets/images/jt_logo.jpeg" alt="JT Logo" style="width: 50px; height: 50px; border-radius: 50%;">
                <h1 style="font-size: 1.5rem; margin: 0;">JT GROUP OF INSTITUTION</h1>
            </div>
            <div>
                <a href="/" style="color: white; text-decoration: none; margin-right: 15px;">Home</a>
                <button onclick="logout()" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 6px; cursor: pointer;">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div style="text-align: center; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; padding: 3rem 2rem; margin: -2rem -2rem 2rem -2rem; border-radius: 20px 20px 0 0;">
                <h2 style="font-size: 2.5rem; margin: 0 0 0.5rem 0;">Unlock All Courses</h2>
                <p>Get 30 days access to all courses</p>
            </div>

            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg"></div>
            
            <div class="info">
                <strong>Test Mode Payments:</strong><br>
                • <strong>Card:</strong> 4111 1111 1111 1111, CVV: 123, OTP: 123456<br>
                • <strong>UPI:</strong> success@razorpay<br>
                • <strong>Net Banking:</strong> Select bank → Click "Success" on popup
            </div>

            <div class="price">₹29</div>
            <div style="text-align: center; color: #718096; margin-bottom: 2rem;">for 30 days full access</div>

            <button id="payButton" class="btn" onclick="startPayment()">
                <i class="fas fa-lock"></i> Pay ₹29 with Razorpay
            </button>

            <div style="text-align: center; margin-top: 1.5rem; color: #718096; font-size: 0.9rem;">
                <i class="fas fa-shield-alt"></i> Secured by Razorpay
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <script>
        console.log('=== Payment Page Loaded ===');
        
        function logout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(() => window.location.href = '/app/login.html');
        }
        
        async function startPayment() {
            console.log('=== Starting Payment ===');
            
            const payButton = document.getElementById('payButton');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            payButton.disabled = true;
            payButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                // Step 1: Check Razorpay loaded
                console.log('Step 1: Checking Razorpay...');
                if (typeof Razorpay === 'undefined') {
                    throw new Error('Razorpay script not loaded. Check internet connection.');
                }
                console.log('✓ Razorpay loaded');
                
                // Step 2: Get user
                console.log('Step 2: Getting user...');
                const userRes = await fetch('/api/auth/me', { credentials: 'include' });
                if (!userRes.ok) {
                    throw new Error('Please login first');
                }
                const user = await userRes.json();
                console.log('✓ User:', user.id);
                
                // Step 3: Create order
                console.log('Step 3: Creating order...');
                const orderRes = await fetch('/api/payment/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id }),
                    credentials: 'include'
                });
                
                const orderData = await orderRes.json();
                console.log('Order response:', orderData);
                
                if (!orderRes.ok || !orderData.orderId) {
                    throw new Error(orderData.error || 'Failed to create order');
                }
                console.log('✓ Order created:', orderData.orderId);
                
                // Step 4: Launch Razorpay
                console.log('Step 4: Launching Razorpay...');
                console.log('Key:', orderData.keyId?.substring(0, 20));
                console.log('Amount:', orderData.amount);
                
                const options = {
                    key: orderData.keyId,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: 'JT Group of Institution',
                    description: '30 Days Full Access',
                    order_id: orderData.orderId,
                    prefill: {
                        name: user.name || '',
                        email: user.email || ''
                    },
                    theme: { color: '#11998e' },
                    handler: function(response) {
                        console.log('✓ Payment successful:', response.razorpay_payment_id);
                        verifyPayment(user.id, response);
                    },
                    modal: {
                        ondismiss: function() {
                            console.log('Payment cancelled');
                            payButton.disabled = false;
                            payButton.innerHTML = '<i class="fas fa-lock"></i> Pay ₹29 with Razorpay';
                        }
                    }
                };
                
                const rzp = new Razorpay(options);
                
                rzp.on('payment.failed', function(response) {
                    console.error('✗ Payment failed:', response.error);
                    errorMsg.textContent = 'Payment failed: ' + (response.error?.description || 'Please try again.');
                    errorMsg.style.display = 'block';
                    payButton.disabled = false;
                    payButton.innerHTML = '<i class="fas fa-lock"></i> Pay ₹29 with Razorpay';
                });
                
                console.log('Opening Razorpay...');
                rzp.open();
                console.log('✓ Razorpay should be open now');
                
            } catch (err) {
                console.error('✗ Error:', err.message);
                errorMsg.textContent = err.message || 'Payment failed. Please try again.';
                errorMsg.style.display = 'block';
                payButton.disabled = false;
                payButton.innerHTML = '<i class="fas fa-lock"></i> Pay ₹29 with Razorpay';
            }
        }
        
        async function verifyPayment(userId, response) {
            console.log('Verifying payment...');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            try {
                const verifyRes = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    }),
                    credentials: 'include'
                });
                
                if (verifyRes.ok) {
                    successMsg.textContent = 'Payment successful! Subscription activated.';
                    successMsg.style.display = 'block';
                } else {
                    const errorData = await verifyRes.json();
                    throw new Error(errorData.error || 'Payment verification failed');
                }
            } catch (err) {
                console.error('Verification error:', err);
                errorMsg.textContent = err.message || 'Payment verification failed';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
