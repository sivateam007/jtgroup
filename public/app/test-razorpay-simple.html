<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <h1>Test Razorpay Payment</h1>
    <button onclick="testPay()">Test Payment with Card</button>
    <button onclick="testPayUPI()">Test Payment with UPI</button>
    <div id="status"></div>

    <script>
        console.log('Script loaded');
        console.log('Razorpay object:', typeof Razorpay);

        function testPay() {
            console.log('Starting test payment...');
            document.getElementById('status').innerText = 'Opening Razorpay...';

            if (typeof Razorpay === 'undefined') {
                document.getElementById('status').innerText = 'ERROR: Razorpay not loaded!';
                return;
            }

            const options = {
                key: 'rzp_test_Sk1Qr5nGd7fPmU',
                amount: 2900,
                currency: 'INR',
                name: 'Test',
                description: 'Test Payment',
                order_id: 'order_test_' + Date.now(),
                handler: function(response) {
                    document.getElementById('status').innerText = 'SUCCESS! Payment ID: ' + response.razorpay_payment_id;
                },
                modal: {
                    ondismiss: function() {
                        document.getElementById('status').innerText = 'CANCELLED by user';
                    }
                },
                theme: { color: '#0c1f33' }
            };

            try {
                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function(response) {
                    document.getElementById('status').innerText = 'FAILED: ' + response.error.description;
                });
                rzp.open();
                console.log('Razorpay opened');
            } catch(e) {
                document.getElementById('status').innerText = 'ERROR: ' + e.message;
            }
        }

        function testPayUPI() {
            console.log('Starting UPI test...');
            document.getElementById('status').innerText = 'Opening Razorpay (UPI)...';

            if (typeof Razorpay === 'undefined') {
                document.getElementById('status').innerText = 'ERROR: Razorpay not loaded!';
                return;
            }

            const options = {
                key: 'rzp_test_Sk1Qr5nGd7fPmU',
                amount: 2900,
                currency: 'INR',
                name: 'Test',
                description: 'Test UPI Payment',
                method: {
                    upi: true,
                    card: false,
                    netbanking: false
                },
                handler: function(response) {
                    document.getElementById('status').innerText = 'SUCCESS! Payment ID: ' + response.razorpay_payment_id;
                },
                modal: {
                    ondismiss: function() {
                        document.getElementById('status').innerText = 'CANCELLED by user';
                    }
                },
                theme: { color: '#0c1f33' }
            };

            try {
                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function(response) {
                    document.getElementById('status').innerText = 'FAILED: ' + response.error.description;
                });
                rzp.open();
                console.log('Razorpay opened (UPI)');
            } catch(e) {
                document.getElementById('status').innerText = 'ERROR: ' + e.message;
            }
        }
    </script>

<script>
(function(){
    var langMap = {tamil:'ta', hindi:'hi', bengali:'bn', malayalam:'ml', telugu:'te'};
    var path = window.location.pathname;
    var match = path.match(/\/courses\/(tamil|hindi|bengali|malayalam|telugu)\//);
    var targetLang = match ? langMap[match[1]] : 'ta';
    if (targetLang === 'ta') return;
    var div = document.createElement('div');
    div.id = 'gt_auto';
    div.style.cssText = 'display:none!important;width:0!important;height:0!important';
    document.body.appendChild(div);
    window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
            pageLanguage: 'ta',
            includedLanguages: 'ta,hi,bn,ml,te,en',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'gt_auto');
        var check = setInterval(function() {
            var sel = document.querySelector('.goog-te-combo');
            if (sel && sel.options.length > 1) {
                clearInterval(check);
                sel.value = targetLang;
                sel.dispatchEvent(new Event('change'));
            }
        }, 200);
    };
})();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<style>
.goog-te-banner-frame.skiptranslate{display:none!important}
body{top:0!important}
.goog-te-gadget{display:none!important}
.skiptranslate{display:none!important}
</style>
