<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JT Group of Institution -Web Development Course Fee Payment</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.payment-card {
    background: #ffffff;
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.payment-card h2 {
    margin-bottom: 10px;
    color: #1e3c72;
}

.payment-card p {
    color: #666;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1e3c72;
}
.fee {
    font-size: 22px;
    font-weight: 600;
    color: #2a5298;
}
</style>
</head>

<body>

<div class="payment-card">
    <h2>JT Group of Institution</h2>
    <p>Web Development Course Fee Payment</p>
    <div class="fee">â‚¹395 Only</div>

    <input type="text" id="name" placeholder="Student Name" required>
    <input type="email" id="email" placeholder="Student Email" required>

    <form><script src="https://checkout.razorpay.com/v1/payment-button.js" data-payment_button_id="pl_SGgzIMGeF1Dij8" async> </script> </form>
</div>




<script>
(function(){
    var langMap = {tamil:'ta', hindi:'hi', bengali:'bn', malayalam:'ml', telugu:'te'};
    var path = window.location.pathname;
    var match = path.match(/\/courses\/(tamil|hindi|bengali|malayalam|telugu)\//);
    var targetLang = match ? langMap[match[1]] : 'ta';
    if (targetLang === 'ta') return;
    var div = document.createElement('div');
    div.id = 'gt_auto';
    div.style.cssText = 'display:none!important;width:0!important;height:0!important';
    document.body.appendChild(div);
    window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
            pageLanguage: 'ta',
            includedLanguages: 'ta,hi,bn,ml,te,en',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'gt_auto');
        var check = setInterval(function() {
            var sel = document.querySelector('.goog-te-combo');
            if (sel && sel.options.length > 1) {
                clearInterval(check);
                sel.value = targetLang;
                sel.dispatchEvent(new Event('change'));
            }
        }, 200);
    };
})();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
